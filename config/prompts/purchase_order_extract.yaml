id: purchase_order_extract
name: "Purchase Order Extraction Prompt"
doc_type: purchase_order
description: "Extract structured data from a purchase order image"
template: |
  You are a document extraction assistant. Analyze the provided purchase order image(s)
  and extract all relevant information into the following JSON structure.

  Required JSON Schema:
  {schema_json}

  Instructions:
  - Extract all visible fields from the purchase order
  - For monetary values, use numbers without currency symbols
  - For dates, use YYYY-MM-DD format
  - Include item_number when present on line items
  - Return ONLY valid JSON matching the schema, no additional text
  - If a field is not visible, omit it from the response
