[project]
name = "ocr-model-evaluator"
version = "0.1.0"
description = "Evaluate LLM/OCR models for document extraction"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "streamlit>=1.35.0",
    "pymupdf>=1.24.0",
    "fpdf2>=2.8.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
